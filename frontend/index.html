<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="/favicon.svg"><title>Deep Agent</title><script>try{const theme=localStorage.getItem('theme');document.documentElement.dataset.theme=['dark','light'].includes(theme)?theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';const locale=localStorage.getItem('locale');document.documentElement.lang=locale==='en'?'en':locale==='zh'?'zh-CN':navigator.language.startsWith('zh')?'zh-CN':'en'}catch{}</script></head><body><div id="app"></div><script type="module" src="/src/main.js"></script></body></html>
