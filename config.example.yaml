# Native deep_agent_cli grouped model format.
# Copy to .platform/config.yaml or set PLATFORM_CONFIG before the first start.
# Once saved in the UI, the encrypted database configuration takes precedence.
llm:
  default: deepseek/deepseek-flash
  timeout: 60
  models:
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key: ${DEEPSEEK_API_KEY}
      api: chat_completions
      # As in the CLI, the first supported reasoning effort is the default.
      reasoning_efforts: [high, low, max]
      models:
        deepseek-flash:
          input: [text]
